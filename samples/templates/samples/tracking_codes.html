{% extends "home/layout.html" %}
{% load static %}

{% block css %}
	<link rel="stylesheet" href='{% static "home/vendor/datatables/media/css/dataTables.jqueryui.min.css" %}'>
{% endblock %}

{% block js %}
	<script type="text/javascript" src='{% static "home/vendor/datatables/media/js/jquery.dataTables.js" %}'></script>
{% endblock %}

{% block content %}
<div class="page-title">Tracking Codes</div>

<div class="panel panel-default">
	<div class="panel-body">
		<table class='table table-bordered table-striped table-condensed' id='tab_id'>
			<thead>
				<tr>
					<th>Tracking Code</th>
					<th>Facility</th>
					<th>District</th>
					<th>Samples</th>
					<th>Created</th>
					<th>...</th>
				</tr>
			</thead>
		</table>
	</div>
</div>

<script type="text/javascript">
$(document).ready(function() {
	$('#tab_id').DataTable({
		processing: true,
		serverSide: true,
		searching: true,
		ajax: '/samples/tracking_codes_json/'
	});
});
</script>
{% endblock %}
