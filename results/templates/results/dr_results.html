{% extends "home/layout.html" %}
{% load static %}

{% block css %}
	<link rel="stylesheet" href='{% static "home/vendor/datatables/media/css/dataTables.jqueryui.min.css" %}'>
	<link rel="stylesheet" href='{% static "home/vendor/select2/dist/css/select2.min.css" %}'>
{% endblock %}

{% block js %}
	<script type="text/javascript" src='{% static "home/vendor/datatables/media/js/jquery.dataTables.js" %}'></script>
	<script type="text/javascript" src='{% static "home/vendor/select2/dist/js/select2.min.js" %}'></script>
{% endblock %}

{% block content %}	
	<span class="page-title">results review for DR </span>
	<div class="panel panel-default">
		<div class="panel-body">
			<div class="row" style="margin-bottom: 15px;">
				<div class="col-md-3">
					<label for="envelope_number">Envelope</label>
					<input type="text" class="form-control input-sm" id="envelope_number" placeholder="Envelope number">
				</div>
				<div class="col-md-3">
					<label for="barcode">Barcode</label>
					<input type="text" class="form-control input-sm" id="barcode" placeholder="Barcode">
				</div>
				<div class="col-md-4">
					<label for="facility_id">Facility</label>
					<select class="form-control input-sm" id="facility_id">
						<option value="">All facilities</option>
						{% for facility in facilities %}
						<option value="{{ facility.id }}">{{ facility.facility }}</option>
						{% endfor %}
					</select>
				</div>
				<div class="col-md-2" style="padding-top: 25px;">
					<a href="#" class="btn btn-default btn-sm" id="clear_filters">Clear</a>
				</div>
			</div>
			<table class="table table-condensed table-striped table-bordered" id="tab_id">
				<thead>
					<th>Barcode</th>
					<th>Type</th>
	                <th>Form&nbsp;Number</th>
	                <th>Facility</th>
	                <th>Art Number</th>
	                <th>DOB</th>
	                <th>Age(yrs)</th>
	                <th>Indication for Testing</th>
	                <th>Current Regimen</th>
	                <th>Data Source</th>
	                <th></th>
			    </thead>
			</table>

		</div>
	</div>

<script type="text/javascript">
$(document).ready(function() {
	$("#facility_id").select2({
		placeholder: "All facilities",
		allowClear: true,
		width: '100%'
	});

	var table = $('#tab_id').DataTable({
		"processing": true,
		"serverSide": true,
		"searching": false,
		"lengthMenu": [[25, 50, 100, -1], [25, 50, 100, "All"]],
		"ajax": {
			"url": "/results/dr_results_json/",
			"data": function(d) {
				d.envelope_number = $("#envelope_number").val();
				d.barcode = $("#barcode").val();
				d.facility_id = $("#facility_id").val();
			}
		}
	});

	function reloadTable() {
		table.ajax.reload();
	}

	$("#envelope_number, #barcode").on("keyup", function(e) {
		if (e.keyCode === 13) {
			reloadTable();
		}
	});

	$("#facility_id").on("change", function(){
		reloadTable();
	});

	$("#clear_filters").on("click", function(e){
		e.preventDefault();
		$("#envelope_number").val('');
		$("#barcode").val('');
		$("#facility_id").val('');
		reloadTable();
	});

	$('#tab_id').on("click", ".approve_for_dr", function(e){
		e.preventDefault();
		var that = $(this);
		var result_pk = that.attr('result-pk');
		var params = {csrfmiddlewaretoken:"{{ csrf_token }}", result_pk: result_pk};
		$.post("/results/approve_for_dr/"+result_pk+"/", params).done(function(data) {
			if(data==1){
				table.row(that.closest('tr')).remove().draw(false);
			}
		});
	});
});
</script>
{% endblock %}
