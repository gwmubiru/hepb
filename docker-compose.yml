services:
  webapp:
    image: bokello/hepb:latest
    container_name: webapp

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://10.200.254.144:8000/health/', timeout=5)\" || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: hepb-watchtower-1

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog.sh:/opt/watchdog/watchdog.sh:ro
      - ./msmtprc:/etc/msmtprc:ro
      - ./watchdog-state:/var/lib/docker-watchdog

    environment:
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LABEL_ENABLE: "true"

    restart: unless-stopped

  watchdog:
    image: alpine:3.22
    container_name: hepb-watchdog

    depends_on:
      - webapp

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchdog.sh:/opt/watchdog/watchdog.sh:ro
      - ./watchdog-state:/var/lib/docker-watchdog

    env_file:
      - watchdog.env

    command: >
      /bin/sh -c "
      apk add --no-cache docker-cli curl msmtp ca-certificates &&
      chmod +x /opt/watchdog/watchdog.sh &&
      while true;
      do
        /opt/watchdog/watchdog.sh;
        sleep 60;
      done
      "

    restart: unless-stopped
